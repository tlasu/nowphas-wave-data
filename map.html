<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOWPHAS 観測地点マップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #1c2430;
    --muted: #5c6570;
    --line: #e0d9cc;
    --paper: #f7f4ee;
    --bg: #efeae2;
    --accent: #155a8a;
    --sea: #0e4d6c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    height: 100%;
    overflow: hidden;
    color: var(--ink);
    background: var(--paper);
    border-top: 3px solid var(--accent);
    font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  aside {
    width: 360px;
    flex: none;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--paper);
    border-right: 1px solid var(--line);
  }
  .head { padding: 16px 16px 10px; }
  .kicker {
    margin: 0;
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.16em;
  }
  h1 { margin: 2px 0 0; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .search {
    width: 100%;
    margin-top: 12px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: #fff;
    color: inherit;
    font: inherit;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .chips button[aria-checked="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .check {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
  }
  .count-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
  }
  #count { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .text-btn {
    border: 0;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 12px;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .text-btn:disabled { color: #a39e94; cursor: default; text-decoration: none; }
  .list-wrap { overflow: auto; min-height: 0; flex: 1; }
  #list, .noloc ul { list-style: none; margin: 0; padding: 0; }
  .station {
    display: grid;
    grid-template-columns: 12px 1fr;
    column-gap: 8px;
    width: 100%;
    padding: 8px 16px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .station:hover { background: var(--bg); }
  .station[aria-current="true"] { background: #e3eef3; }
  .dot {
    width: 8px;
    height: 8px;
    margin-top: 6px;
    border-radius: 50%;
    grid-row: 1 / span 2;
  }
  .dot.ended { background: transparent !important; box-shadow: inset 0 0 0 1.5px currentColor; }
  .station-top { display: flex; justify-content: space-between; gap: 8px; }
  .name { font-weight: 600; }
  .code, .noloc .code {
    color: var(--muted);
    font-family: ui-monospace, "Cascadia Mono", "Source Han Mono", monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .station-sub { color: var(--muted); font-size: 12px; }
  .empty { padding: 16px; color: var(--muted); font-size: 13px; }
  .noloc { border-top: 1px solid var(--line); }
  .noloc summary { padding: 10px 16px; cursor: pointer; font-size: 13px; }
  .noloc ul { padding: 0 16px 8px; }
  .noloc li.empty { display: block; }
  .noloc li {
    display: grid;
    grid-template-columns: 2.6em 6em 1fr;
    gap: 6px;
    padding: 3px 0;
    color: var(--muted);
    font-size: 12px;
  }
  .noloc .name { font-weight: 600; color: var(--ink); }
  .note {
    margin: 0;
    padding: 12px 16px 16px;
    color: var(--muted);
    font-size: 11px;
  }
  .note a { color: var(--accent); }
  main { flex: 1; min-width: 0; display: flex; }
  #map { flex: 1; background: #d5e4ea; }
  .map-error { margin: 0; padding: 24px; color: var(--muted); }
  .legend {
    background: rgba(247, 244, 238, 0.94);
    border: 1px solid var(--line);
    padding: 8px 10px;
    color: var(--ink);
    font-size: 12px;
    line-height: 1.35;
  }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .swatch.hollow { background: var(--paper) !important; box-shadow: inset 0 0 0 1.5px currentColor; }
  .leaflet-bar a { background: var(--paper); color: var(--ink); border-bottom-color: var(--line); }
  .leaflet-control-attribution, .leaflet-control-scale-line {
    background: rgba(247, 244, 238, 0.92);
    color: var(--muted);
  }
  .leaflet-control-attribution a { color: var(--accent); }
  .tip {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink);
    box-shadow: none;
    font-size: 12px;
    font-weight: 600;
  }
  .tip::before { border-top-color: var(--paper); }
  .station-popup .leaflet-popup-content-wrapper {
    border-radius: 2px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 10px 28px rgba(28, 36, 48, 0.18);
  }
  .station-popup .leaflet-popup-tip { background: var(--paper); }
  .station-popup .leaflet-popup-content { margin: 12px 14px 14px; line-height: 1.45; }
  .popup-kicker { margin: 0; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; }
  .popup-title { margin: 2px 0 0; font-size: 18px; font-weight: 600; }
  .ended-tag { margin: 4px 0 0; color: #8a4b2f; font-size: 12px; }
  .popup dl {
    display: grid;
    grid-template-columns: 6.2em 1fr;
    gap: 3px 10px;
    margin: 10px 0 0;
    font-size: 13px;
  }
  .popup dt { margin: 0; color: var(--muted); }
  .popup dd { margin: 0; font-variant-numeric: tabular-nums; }
  .near { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: auto; height: 46%; border-right: 0; border-bottom: 1px solid var(--line); }
    main { height: 54%; flex: none; }
  }
</style>
</head>

</aside>

  if (typeof L === "undefined") {

  }

  const search = document.getElementById("search");

  const fitBtn = document.getElementById("fit");

  const nolocSummary = document.getElementById("noloc-summary");
  const nolocDetails = document.getElementById("noloc-details");

  let stations = [];

  let byCode = new Map();
  let markers = new Map();
  let neighbors = new Map();
  let activeCat = "すべて";
  let query = "";

  let selected = null;
  let pendingOpen = null;
  let map;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function num(v) {
    if (v == null || v === "") return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/).filter(Boolean);
    return lines.slice(1).map(function (line) {
      const c = line.split(",");
      return {
        code: c[0],
        name: c[1],
        instrument: c[2] || null,
        depth: num(c[3]),
        lat: num(c[4]),
        lon: num(c[5]),
        locYear: num(c[6]),
        y20a: num(c[7]),
        y20b: num(c[8]),
        y2a: num(c[9]),
        y2b: num(c[10])
      };
    }).filter(function (s) { return s.code; });
  }

  function category(s) {
    if (s.instrument === "海象計" || s.instrument === "USW" || s.instrument === "GPS") return s.instrument;
    return "その他";
  }

  function isCurrent(s) {
    return s.y20b === 2024 || s.y2b === 2024;
  }

  function instLabel(s) {
    return s.instrument || "機種不明";
  }

  function span(a, b) {
    if (a == null || b == null) return "なし";
    return a === b ? String(a) : a + "–" + b;
  }

  function fmtDepth(v) {
    const n = Math.abs(v).toFixed(1);
    return (v < 0 ? "−" : "") + n + " m";
  }

  function fmtDist(km) {
    if (km < 1) return Math.round(km * 1000) + " m";
    return km.toFixed(1) + " km";
  }

  function haversine(a, b) {
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLon = (b.lon - a.lon) * Math.PI / 180;
    const la1 = a.lat * Math.PI / 180;
    const la2 = b.lat * Math.PI / 180;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function matchesQuery(s) {
    if (!query) return true;
    const inst = (s.instrument || "").toLowerCase();
    return s.code.toLowerCase().includes(query) || s.name.toLowerCase().includes(query) || inst.includes(query);
  }

  function passes(s, cat) {
    if (s.lat == null || s.lon == null) return false;
    if (cat !== "すべて" && category(s) !== cat) return false;
    if (onlyCurrent && !isCurrent(s)) return false;
    return matchesQuery(s);
  }

  function summaryLine(s) {
    const bits = [instLabel(s)];
    if (s.depth != null) bits.push(fmtDepth(s.depth));
    if (s.y20a != null) bits.push("20分 " + span(s.y20a, s.y20b));
    if (s.y2a != null) bits.push("2時間 " + span(s.y2a, s.y2b));
    return bits.join(" · ");
  }

  function popupHtml(s) {
    const near = neighbors.get(s.code) || [];
    const nearHtml = near.length
      ? '<p class="near">近くの地点（5 km以内）: ' + near.map(function (n) {
          return esc(n.name) + "（" + esc(n.code) + "） " + fmtDist(n.km);
        }).join("、") + "</p>"
      : "";
    const ended = isCurrent(s) ? "" : '<p class="ended-tag">2024年の観測なし</p>';
    return '<div class="popup">'
      + '<p class="popup-kicker">' + esc(s.code) + " · " + esc(instLabel(s)) + "</p>"
      + '<p class="popup-title">' + esc(s.name) + "</p>"
      + ended
      + "<dl>"
      + "<dt>設置水深</dt><dd>" + (s.depth == null ? "—" : esc(fmtDepth(s.depth))) + "</dd>"
      + "<dt>緯度・経度</dt><dd>" + s.lat.toFixed(5) + "°N<br>" + s.lon.toFixed(5) + "°E</dd>"
      + "<dt>位置の出典</dt><dd>" + (s.locYear == null ? "—" : s.locYear + "年") + "</dd>"
      + "<dt>20分値</dt><dd>" + esc(span(s.y20a, s.y20b)) + "</dd>"
      + "<dt>2時間値</dt><dd>" + esc(span(s.y2a, s.y2b)) + "</dd>"
      + "</dl>"
      + nearHtml
      + "</div>";
  }

  function markerStyle(s) {
    const color = COLORS[category(s)];
    const current = isCurrent(s);
    return {
      radius: 7,
      color: color,
      weight: current ? 1 : 2,
      fillColor: current ? color : "#f7f4ee",
      fillOpacity: 1,
      opacity: 1
    };
  }

  function markCurrent(scroll) {
    const buttons = list.querySelectorAll("button[data-code]");
    buttons.forEach(function (btn) {
      const on = btn.dataset.code === selected;
      btn.setAttribute("aria-current", on ? "true" : "false");
      if (on && scroll) btn.scrollIntoView({ block: "nearest" });
    });
  }

  function fitTo(rows) {
    if (!rows.length) return;
    const bounds = L.latLngBounds(rows.map(function (s) { return [s.lat, s.lon]; }));
    map.fitBounds(bounds, { padding: [32, 32], maxZoom: 9, animate: !reduceMotion });
  }

  function renderList(shown) {
    if (!shown.length) {
      list.innerHTML = '<li class="empty">該当する地点がありません</li>';
      return;
    }
    list.innerHTML = shown.map(function (s) {
      const color = COLORS[category(s)];
      const ended = isCurrent(s) ? "" : " ended";
      const current = s.code === selected ? "true" : "false";
      return '<li><button type="button" class="station" data-code="' + esc(s.code) + '" aria-current="' + current + '">'
        + '<span class="dot' + ended + '" style="color:' + color + ';background:' + color + '"></span>'
        + '<span class="station-top"><span class="name">' + esc(s.name) + '</span><span class="code">' + esc(s.code) + "</span></span>"
        + '<span class="station-sub">' + esc(summaryLine(s)) + "</span>"
        + "</button></li>";
    }).join("");
  }

  function renderNoLoc() {
    const rows = stations.filter(function (s) {
      return (s.lat == null || s.lon == null) && matchesQuery(s);
    });
    const total = stations.filter(function (s) { return s.lat == null || s.lon == null; }).length;
    nolocSummary.textContent = rows.length === total
      ? "位置情報なし " + total
      : "位置情報なし " + rows.length + " / " + total;
    nolocList.innerHTML = rows.map(function (s) {
      return "<li><span class=\"code\">" + esc(s.code) + "</span><span class=\"name\">" + esc(s.name)
        + "</span><span>2時間 " + esc(span(s.y2a, s.y2b)) + "</span></li>";
    }).join("") || '<li class="empty">該当なし</li>';
    if (query && rows.length && !located.some(function (s) { return passes(s, activeCat); })) {
      nolocDetails.open = true;
    }
  }

  function apply(opts) {
    const shown = located.filter(function (s) { return passes(s, activeCat); });
    located.forEach(function (s) {
      const marker = markers.get(s.code);
      if (passes(s, activeCat)) {
        if (!map.hasLayer(marker)) marker.addTo(map);
        if (isCurrent(s)) marker.bringToFront();
      } else if (map.hasLayer(marker)) {
        map.removeLayer(marker);
      }
    });
    if (selected && !shown.some(function (s) { return s.code === selected; })) {
      selected = null;
      map.closePopup();
    }
    chips.querySelectorAll("[data-cat]").forEach(function (btn) {
      const cat = btn.dataset.cat;
      const n = located.filter(function (s) { return passes(s, cat); }).length;
      btn.textContent = cat + " " + n;
    });
    countEl.textContent = "表示 " + shown.length + " / 位置あり " + located.length;
    fitBtn.disabled = shown.length === 0;
    renderList(shown);
    renderNoLoc();
    if (opts && opts.fit) fitTo(shown);
  }

  function focusStation(code) {
    const s = byCode.get(code);
    const marker = markers.get(code);
    if (!s || !marker) return;
    selected = code;
    markCurrent(true);
    const target = L.latLng(s.lat, s.lon);
    const zoom = Math.max(map.getZoom(), 8);
    const open = function () {
      pendingOpen = null;
      marker.openPopup();
    };
    if (pendingOpen) map.off("moveend", pendingOpen);
    const already = map.getZoom() === zoom && map.getCenter().distanceTo(target) < 80;
    if (already) {
      open();
      return;
    }
    pendingOpen = open;
    map.once("moveend", pendingOpen);
    if (reduceMotion) map.setView(target, zoom);
    else map.flyTo(target, zoom, { duration: 0.55 });
  }

  function boot(text) {
    stations = parseCSV(text);
    located = stations.filter(function (s) { return s.lat != null && s.lon != null; });
    byCode = new Map(stations.map(function (s) { return [s.code, s]; }));

    located.forEach(function (s) {
      const listNear = [];
      located.forEach(function (o) {
        if (o.code === s.code) return;
        const km = haversine(s, o);
        if (km < 5) listNear.push({ code: o.code, name: o.name, km: km });
      });
      listNear.sort(function (a, b) { return a.km - b.km; });
      neighbors.set(s.code, listNear);
    });

    mapEl.replaceChildren();
    map = L.map(mapEl, {
      zoomControl: false,
      minZoom: 4,
      maxBounds: [[20, 118], [48, 154]],
      maxBoundsViscosity: 0.7
    }).setView([36.5, 136], 5);

    L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
      attribution: '出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>',
      maxZoom: 18
    }).addTo(map);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.control.scale({ imperial: false, position: "bottomright" }).addTo(map);

    const legend = L.control({ position: "bottomleft" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = [
        ["海象計", false],
        ["USW", false],
        ["GPS", false],
        ["その他", false],
        ["2024年の観測なし", true]
      ].map(function (item) {
        const color = item[1] ? "#5c6570" : COLORS[item[0]];
        const hollow = item[1] ? " hollow" : "";
        return '<div class="legend-row"><span class="swatch' + hollow + '" style="color:' + color + ';background:' + color + '"></span>' + item[0] + "</div>";
      }).join("");
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    legend.addTo(map);

    located.forEach(function (s) {
      const marker = L.circleMarker([s.lat, s.lon], markerStyle(s));
      marker.bindTooltip(s.name + "（" + s.code + "）", {
        direction: "top",
        offset: [0, -8],
        opacity: 1,
        className: "tip"
      });
      marker.bindPopup(popupHtml(s), { maxWidth: 280, className: "station-popup", autoPanPadding: [24, 24] });
      marker.getPopup()._stationCode = s.code;
      marker.on("click", function () {
        selected = s.code;
        markCurrent(true);
      });
      markers.set(s.code, marker);
    });

    map.on("popupclose", function (e) {
      const code = e.popup && e.popup._stationCode;
      if (code && code === selected) {
        selected = null;
        markCurrent(false);
      }
    });

    list.addEventListener("click", function (e) {
      const btn = e.target.closest("button[data-code]");
      if (btn) focusStation(btn.dataset.code);
    });

    chips.addEventListener("click", function (e) {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      activeCat = btn.dataset.cat;
      chips.querySelectorAll("[data-cat]").forEach(function (b) {
        b.setAttribute("aria-checked", b === btn ? "true" : "false");
      });
      apply({ fit: true });
    });

    chips.addEventListener("keydown", function (e) {
      const keys = ["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"];
      if (keys.indexOf(e.key) === -1) return;
      const btns = Array.prototype.slice.call(chips.querySelectorAll("[role=radio]"));
      const i = btns.indexOf(document.activeElement);
      if (i < 0) return;
      e.preventDefault();
      const dir = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1;
      const next = btns[(i + dir + btns.length) % btns.length];
      next.focus();
      next.click();
    });

    search.addEventListener("input", function () {
      query = search.value.trim().toLowerCase();
      apply({ fit: false });
    });

    onlyCurrentInput.addEventListener("change", function () {
      onlyCurrent = onlyCurrentInput.checked;
      apply({ fit: true });
    });

    fitBtn.addEventListener("click", function () {
      fitTo(located.filter(function (s) { return passes(s, activeCat); }));
    });

    apply({ fit: false });
    requestAnimationFrame(function () {
      map.invalidateSize();
      fitTo(located);
    });
  }

  const embedded = document.getElementById("stations-csv").textContent;
  fetch("stations.csv", { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error(String(res.status));
      return res.text();
    })
    .then(function (text) {
      if (!text || text.indexOf("station_code") === -1) throw new Error("bad csv");
      return text;
    })
    .catch(function () { return embedded; })
    .then(boot)
    .catch(function () {
      mapEl.innerHTML = '<p class="map-error">地点一覧を読み込めませんでした。</p>';
    });
})();
</script>
</body>
</html>
